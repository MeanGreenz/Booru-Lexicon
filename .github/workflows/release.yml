name: Build & Publish PC Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Install Electron & Electron-Builder for Packaging
        run: npm install --no-save electron@^34.0.0 electron-builder@^25.1.8

      - name: Build Web Bundle & Standalone Offline Package
        run: npm run build:standalone

      - name: Package Windows Portable .exe and Setup Installer .exe
        run: npx electron-builder --win portable nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Illustrious-Lexicon-Windows-Release
          path: |
            release/*.exe
            release/Illustrious-Lexicon-Standalone.html
            release/Launch-Illustrious-Lexicon-PC.bat

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/Illustrious-Lexicon-Standalone.html
            release/Launch-Illustrious-Lexicon-PC.bat
          generate_release_notes: true
          draft: false
          prerelease: false
